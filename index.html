<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#16171a; --muted:#736d62; --line:#e8e2d6;
  --brand:#a8780a; --brand2:#d9a521; --brandSoft:#fbf3dc; --gold:#e3ac25; --goldSoft:#fff6dd;
  --dark:#121316; --dark2:#1e2025; --goldGrad:linear-gradient(135deg,#f8dc7a 0%,#e6b33a 45%,#c48a12 100%);
  --ok:#1d7a52; --okSoft:#e3f3ea; --red:#c8412f; --redSoft:#fdecea; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Noto Nastaliq Urdu',serif;font-size:15px;line-height:2;padding-bottom:84px;max-width:640px;margin:0 auto;min-height:100vh}
.num,input[type=number],input[type=tel]{font-family:'Inter',sans-serif;direction:ltr;unicode-bidi:isolate}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);line-height:1.9}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2)}
a{color:inherit;text-decoration:none}
/* header */
header{background:radial-gradient(120% 140% at 100% 0%,#2a2c32 0%,#141518 55%,#0c0d0f 100%);color:#f3efe6;padding:12px 16px 16px;position:sticky;top:0;z-index:20;border-bottom:2px solid #c9961c;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{width:62px;height:44px;display:grid;place-items:center;flex:none}.logo img{max-width:100%;max-height:100%}
.brandname{font-family:'Inter',sans-serif;font-weight:800;font-size:19px;letter-spacing:2.5px;line-height:1.15;background:var(--goldGrad);-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase}
.tag{font-size:12px;color:#c9c2b2;line-height:1.8}
.search{margin-top:10px;position:relative}
.search input{border:1px solid #3a3c42;background:#24262b;color:#f3efe6;padding-inline-start:40px;border-radius:12px}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%)}
.banner{background:var(--goldSoft);color:#7a5600;font-size:12px;padding:4px 14px;text-align:center}
main{padding:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:2px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-family:'Inter',sans-serif}
.chip.on{background:var(--dark);border-color:var(--dark);color:#f2c54b}
.row{display:flex;gap:8px;align-items:center}
.sec-title{font-weight:700;font-size:16px;color:var(--ink);margin:14px 2px 6px;display:flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);position:relative;box-shadow:0 2px 10px rgba(30,25,10,.05);transition:transform .15s}.card:active{transform:scale(.98)}
.card .ph{aspect-ratio:1/1;background:#eef2f0;display:grid;place-items:center;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .bd{padding:6px 10px 8px}
.price{font-family:'Inter',sans-serif;font-weight:800;color:var(--ink);font-size:16px}
.model{font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;line-height:1.4;margin-top:2px}
.meta{font-size:11.5px;color:var(--muted);line-height:1.9}
.pin{position:absolute;top:8px;inset-inline-start:8px;background:var(--goldGrad);color:#16171a;font-weight:600;box-shadow:0 2px 8px rgba(196,138,18,.4);font-size:11px;padding:0 9px;border-radius:99px;line-height:1.9}
.pta{display:inline-block;font-size:11px;padding:0 8px;border-radius:6px;line-height:1.8}
.pta.y{background:var(--okSoft);color:var(--ok)} .pta.n{background:var(--redSoft);color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:#121316;border-top:1px solid #2c2e33;display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:8px 0 4px;color:#8d887c;line-height:1.6}
nav button.on{color:#f2c54b}
nav .plus{width:50px;height:50px;border-radius:50%;background:var(--goldGrad);display:grid;place-items:center;margin-top:-24px;box-shadow:0 4px 16px rgba(196,138,18,.5);border:3px solid #121316}
/* forms */
.panel{background:#fff;border-radius:var(--radius);border:1px solid var(--line);padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:8px 14px;border-radius:12px;background:var(--goldGrad);color:#16171a;font-weight:700;font-size:15px;box-shadow:0 3px 10px rgba(196,138,18,.28)}
.btn.ghost{background:var(--dark);color:#f2c54b;box-shadow:none}
.btn.gold{background:var(--gold)}
.btn.red{background:var(--redSoft);color:var(--red);box-shadow:none}
.btn.wa{background:#1fa855;color:#fff;box-shadow:0 3px 10px rgba(31,168,85,.25)}
.btn:disabled{opacity:.5}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff}
.plan.on{border-color:var(--dark);background:#f3f1ec}
.plan.gold.on{border-color:var(--gold);background:var(--goldSoft)}
.plan .amt{font-family:'Inter',sans-serif;font-weight:800;font-size:22px}
.plan small{display:block;font-size:11.5px;color:var(--muted);line-height:1.8}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .t{width:78px;height:78px;border-radius:10px;overflow:hidden;position:relative;background:#eef2f0}
.photos .t img{width:100%;height:100%;object-fit:cover}
.photos .t button{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-family:Inter;font-size:13px;line-height:22px}
.photos .add{width:78px;height:78px;border-radius:10px;border:2px dashed #b9c6c0;display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;line-height:1.6}
/* detail */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--radius);background:#eef2f0}
.gal img,.gal .noimg{flex:none;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center}
.noimg{display:grid;place-items:center}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.spec{background:var(--bg);border-radius:10px;padding:4px 10px}
.spec b{display:block;font-family:Inter;font-size:13.5px;line-height:1.6}
.spec span{font-size:11px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:600;font-size:14px;margin-bottom:8px}
.shopbox{background:radial-gradient(120% 140% at 0% 0%,#2a2c32,#121316);color:#f3efe6;border:1px solid #c9961c;border-radius:var(--radius);padding:12px 14px}.shopbox .small{color:#bdb5a4}.darkp .btn.ghost{border:1px solid #c9961c}.search input::placeholder{color:#8d887c}.shopbox b{color:#f2c54b}
/* pay */
.paybox{border:2px dashed var(--brand2);border-radius:var(--radius);padding:14px;text-align:center;background:var(--goldSoft)}
.till{font-family:Inter;font-weight:800;font-size:26px;letter-spacing:3px;color:var(--ink)}
.qr{width:190px;height:190px;margin:8px auto;background:#fff;border-radius:10px;padding:8px}
.status{display:inline-block;font-size:11.5px;padding:0 10px;border-radius:99px;line-height:1.9}
.st-pending{background:var(--goldSoft);color:#8a6200}.st-live{background:var(--okSoft);color:var(--ok)}.st-rejected{background:var(--redSoft);color:var(--red)}
.list-item{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:10px}
.list-item .th{width:72px;height:72px;border-radius:10px;overflow:hidden;flex:none;background:#eef2f0;display:grid;place-items:center}
.list-item .th img{width:100%;height:100%;object-fit:cover}
.warn{background:var(--redSoft);color:var(--red);font-size:12px;border-radius:8px;padding:2px 8px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center}
.stat b{display:block;font-family:Inter;font-size:18px;color:var(--ink);line-height:1.6}
.stat span{font-size:11px;color:var(--muted)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#14201b;color:#fff;padding:6px 18px;border-radius:99px;font-size:13px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:60;padding:20px}
.modal .box{background:#fff;border-radius:16px;padding:16px;max-width:380px;width:100%}
.hide{display:none!important}
.small{font-size:12px;color:var(--muted)}

/* language */
body.ltr{font-family:'Inter',sans-serif;line-height:1.55}
body.ltr input,body.ltr select,body.ltr textarea{line-height:1.5;padding:10px 12px}
body.ltr .btn{padding:12px 14px}
body.ltr .tag{line-height:1.5;margin-top:2px}
body.ltr .meta{line-height:1.6}
body.ltr .chip{padding:5px 14px}
body.ltr nav button{padding:9px 0 6px;font-size:11px;white-space:nowrap;min-width:0}
body.ltr .sec-title{margin:16px 2px 8px}
body.ltr .list-item .small,body.ltr .shopbox .small{line-height:1.5}
body.ltr .plan small{line-height:1.5}
body.ltr .pin{line-height:1.7}
body.ltr .status{line-height:1.8}
.langsw{margin-inline-start:auto;display:flex;background:#24262b;border:1px solid #3a3c42;border-radius:99px;padding:2px;flex:none;align-self:flex-start}
.langsw button{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;color:#bdb5a4;padding:3px 9px;border-radius:99px;line-height:1.5}
.langsw button.ur{font-family:'Noto Nastaliq Urdu',serif;font-size:12px;line-height:1.5;padding-top:0;padding-bottom:4px}
.langsw button.on{background:var(--goldGrad);color:#16171a}
.brandrow{align-items:center}
.bnr{position:relative;margin:0 0 12px;border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 16px rgba(20,15,0,.12);background:#121316}
.bnr-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;direction:ltr}
.bnr-track::-webkit-scrollbar{display:none}
.bnr-track a,.bnr-track div.sl{flex:none;width:100%;aspect-ratio:2/1;scroll-snap-align:center;display:block}
.bnr-track img{width:100%;height:100%;object-fit:cover;display:block}
.bnr-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;direction:ltr}
.bnr-dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.55);transition:all .25s}
.bnr-dots i.on{width:18px;background:#f2c54b}
.bthumb{width:120px;aspect-ratio:2/1;border-radius:10px;overflow:hidden;flex:none;background:#eee}
.bthumb img{width:100%;height:100%;object-fit:cover}
.brandname{white-space:nowrap;font-size:19px;letter-spacing:2px}
.langrow{display:flex;justify-content:center;margin-top:10px}
.langsw{margin:0!important;align-self:auto!important}
.langsw button{padding:3px 16px;font-size:12px}
.langsw button.ur{font-size:13px}
body.ltr .search input{padding-inline-start:40px}
</style>
</head>

    isAdmin=false; allPosts=[]; payments={}; mySubs=[];
    if(!u){ try{await fb.signInAnonymously(auth)}catch(e){console.log(e)} return }

    unsubMine=fb.onSnapshot(fb.query(fb.collection(db,"posts"),fb.where("ownerUid","==",uid)),s=>{mySubs=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
    if(!u.isAnonymous){

  });

function filtered(){

function card(a){

function bannerList(){return banners.length?[...banners].sort((a,b)=>(a.order||0)-(b.order||0)):[{id:"default",img:DEFAULT_BANNER}]}
function bannerHTML(){
  const L=bannerList();
  return `<div class="bnr"><div class="bnr-track" id="bnrTrack">${L.map(b=>b.link?`<a href="${esc(b.link)}" target="_blank" rel="noopener"><img src="${b.img}" alt=""></a>`:`<div class="sl"><img src="${b.img}" alt=""></div>`).join("")}</div>
  ${L.length>1?`<div class="bnr-dots">${L.map((_,i)=>`<i class="${i===bannerIdx%L.length?"on":""}"></i>`).join("")}</div>`:""}</div>`;

function setupBanner(){
  const tr=$("#bnrTrack"); if(!tr)return;
  const n=tr.children.length; if(bannerIdx>=n)bannerIdx=0;
  tr.scrollLeft=bannerIdx*tr.clientWidth;
  tr.onscroll=()=>{clearTimeout(tr._t);tr._t=setTimeout(()=>{bannerIdx=Math.round(tr.scrollLeft/tr.clientWidth);document.querySelectorAll(".bnr-dots i").forEach((d,i)=>d.classList.toggle("on",i===bannerIdx))},80)};
}
setInterval(()=>{const tr=$("#bnrTrack");if(!tr||tr.children.length<2||document.hidden)return;bannerIdx=(bannerIdx+1)%tr.children.length;tr.scrollTo({left:bannerIdx*tr.clientWidth,behavior:"smooth"})},4000);

function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=480,s=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.58))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function makeThumb(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const M=260,k=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.6))};im.onerror=rej;im.src=src})}
function compressQR(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=900,s=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.88))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function adminView(){
  const tabs=`<div class="plans" style="margin:6px 0 12px;gap:6px"><button class="plan ${adminTab==="posts"?"on":""}" data-atab="posts">📋 ${t("tab_posts")}</button><button class="plan ${adminTab==="live"?"on":""}" data-atab="live">📱 ${t("tab_live")}</button><button class="plan ${adminTab==="banners"?"on":""}" data-atab="banners">🖼️ ${t("tab_banners")}</button><button class="plan ${adminTab==="settings"?"on":""}" data-atab="settings">⚙️ ${t("tab_settings")}</button></div>`;
  if(adminTab==="settings")return `<div class="sec-title">${t("admin_title")}</div>`+tabs+settingsView()+`<button class="btn red" style="margin-top:16px" id="adminLogout">${t("logout")}</button>`;
  if(adminTab==="banners")return `<div class="sec-title">${t("admin_title")}</div>`+tabs+bannersAdminView();
  if(adminTab==="live")return `<div class="sec-title">${t("admin_title")}</div>`+tabs+liveAdminView();
  return adminPosts(tabs);
}
function adminBtns(id){return `<div class="two" style="margin-top:6px"><button class="btn ghost" style="color:#f2c54b" data-sold="${esc(id)}">${t("sold_btn")}</button><button class="btn red" data-del="${esc(id)}">${t("del_btn")}</button></div>`}
function liveAdminView(){
  const L=[...(isAdmin&&!demo?allPosts.filter(p=>p.status==="live"):live)].sort((a,b)=>(b.approvedAt||0)-(a.approvedAt||0));
  if(!L.length)return `<div class="empty">${t("no_live")}</div>`;
  return `<div class="small" style="margin-bottom:8px">${t("live_tip")}</div>`+L.map(a=>`<div class="list-item"><div class="th" data-open="${esc(a.id)}">${(a.thumb||(a.photos&&a.photos[0]))?`<img src="${a.thumb||a.photos[0]}">`:phoneSvg(36)}</div>
    <div style="flex:1;min-width:0">
      <div class="model">${esc(brandName(a.brand))} ${esc(a.model)} · <span class="price" style="font-size:13px">${fmt(a.price)}</span></div>
      <div class="small">${esc(a.seller)} · <span class="num">${esc(a.phone)}</span></div>
      <div class="small">${a.plan==="pin"?t("plan_pin_s"):t("plan_norm_s")} · ${ago(a.approvedAt||Date.now())}</div>
      ${adminBtns(a.id)}
    </div></div>`).join("");
}
function bannersAdminView(){
  const L=[...banners].sort((a,b)=>(a.order||0)-(b.order||0));
  return `<div class="small" style="margin-bottom:8px">${t("bn_tip")}</div>
  ${L.map((b,i)=>`<div class="list-item" style="align-items:center"><div class="bthumb"><img src="${b.img}"></div>
    <div style="flex:1;min-width:0"><div class="small">#${i+1}${b.link?` · 🔗 ${esc(b.link).slice(0,28)}`:""}</div>
    <div class="row" style="gap:6px;margin-top:4px">
      <button class="chip" data-bmove="${esc(b.id)}|-1" ${i===0?"disabled style=opacity:.4":""}>▲</button>
      <button class="chip" data-bmove="${esc(b.id)}|1" ${i===L.length-1?"disabled style=opacity:.4":""}>▼</button>
      <button class="chip" style="color:var(--red)" data-bdel="${esc(b.id)}">🗑️ ${t("del_btn").replace(" 🗑️","")}</button>
    </div></div></div>`).join("")}
  ${!L.length?`<div class="list-item" style="align-items:center"><div class="bthumb"><img src="${DEFAULT_BANNER}"></div><div class="small">${t("bn_default")}</div></div>`:""}
  ${L.length<MAX_BANNERS?`<div class="panel"><b>➕ ${t("bn_add")}</b>
    <label>${t("bn_img")}</label>
    ${bnDraft.img?`<div class="bthumb" style="width:100%;margin-bottom:6px"><img src="${bnDraft.img}"></div>`:""}
    <label class="btn ghost" style="margin:0;color:#f2c54b">${bnDraft.img?t("bn_change"):t("bn_pick")}<input type="file" accept="image/*" id="bnIn" class="hide"></label>
    <label>${t("bn_link")}</label><input id="bnLink" placeholder="https://wa.me/923007057121" value="${esc(bnDraft.link)}">
    <button class="btn" style="margin-top:10px" id="bnSave" ${bnDraft.img?"":"disabled"}>${t("bn_save")}</button>
  </div>`:`<div class="small" style="text-align:center">${t("bn_max",{n:MAX_BANNERS})}</div>`}`;
}
let bnDraft={img:"",link:""};
function compressBanner(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const W=900,H=450;const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");const sc=Math.max(W/im.width,H/im.height);const w=im.width*sc,h=im.height*sc;x.fillStyle="#121316";x.fillRect(0,0,W,H);x.drawImage(im,(W-w)/2,(H-h)/2,w,h);res(c.toDataURL("image/jpeg",.78))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function settingsView(){
  if(!setDraft)setDraft={tillId:SHOP.tillId,jcName:SHOP.jcName,phone:SHOP.phone,whatsapp:"0"+String(SHOP.whatsapp).replace(/^92/,""),normal:SHOP.fees.normal,pin:SHOP.fees.pin,qr:SHOP.qr};
  const d=setDraft;
  return `<div class="panel">
    <b>💳 ${t("set_pay")}</b>
    <label>${t("set_till")}</label><input class="num" inputmode="numeric" data-s="tillId" value="${esc(d.tillId)}">
    <label>${t("set_jcname")}</label><input data-s="jcName" value="${esc(d.jcName)}">
    <label>${t("set_qr")}</label>
    <div class="row" style="align-items:flex-start;gap:12px"><div class="qr" style="margin:0;width:120px;height:120px;border:1px solid var(--line)"><img src="${d.qr}" style="width:100%;height:100%;object-fit:contain"></div>
    <div style="flex:1"><label class="btn ghost" style="margin:0;color:#f2c54b">${t("set_qr_btn")}<input type="file" accept="image/*" id="qrIn" class="hide"></label><div class="small" style="margin-top:6px">${t("set_qr_tip")}</div></div></div>
  </div>
  <div class="panel">
    <b>📞 ${t("set_contact")}</b>
    <div class="two"><div><label>${t("set_phone")}</label><input type="tel" data-s="phone" value="${esc(d.phone)}"></div><div><label>WhatsApp</label><input type="tel" data-s="whatsapp" value="${esc(d.whatsapp)}"></div></div>
  </div>
  <div class="panel">
    <b>💰 ${t("set_fees")}</b>
    <div class="two"><div><label>${t("plan_normal")} (Rs)</label><input type="number" inputmode="numeric" data-s="normal" value="${esc(d.normal)}"></div><div><label>${t("plan_pin")} (Rs)</label><input type="number" inputmode="numeric" data-s="pin" value="${esc(d.pin)}"></div></div>
  </div>
  <button class="btn" id="saveSet">${t("set_save")}</button>
  <button class="btn red" style="margin-top:8px" id="cancelSet">${t("cancel")}</button>
  <p class="small" style="text-align:center;margin-top:6px">${t("set_note")}</p>`;
}
function adminPosts(tabs){
  const rows=adminRows(); const pend=rows.filter(r=>r.p.status==="pending").sort((a,b)=>a.p.created-b.p.created);
  const paid=rows.filter(r=>r.p.status==="live"||r.p.status==="sold");
  const income=paid.reduce((s,r)=>s+(+r.p.fee||SHOP.fees[r.p.plan]),0);
  const tidCount={};rows.forEach(r=>{const x=(r.p.tid||"").trim();if(x)tidCount[x]=(tidCount[x]||0)+1});
  return `<div class="sec-title">${t("admin_title")}</div>${tabs}
  <div class="stats"><div class="stat"><b>${pend.length}</b><span>${t("pending_s")}</span></div><div class="stat"><b>${live.length}</b><span>${t("live_s")}</span></div><div class="stat"><b>${income.toLocaleString("en-PK")}</b><span>${t("income_s")}</span></div></div>
  <div class="small" style="margin-bottom:8px">${t("admin_tip")}</div>
  ${pend.length?pend.map(({uid,p})=>`<div class="list-item"><div class="th">${(p.thumb||(p.photos&&p.photos[0]))?`<img src="${p.thumb||p.photos[0]}">`:phoneSvg(36)}</div>
    <div style="flex:1;min-width:0">
      <div class="model">${esc(brandName(p.brand))} ${esc(p.model)} · <span class="price" style="font-size:13px">${fmt(p.price)}</span></div>
      <div class="small">${esc(p.seller)} · <span class="num">${esc(p.phone)}</span></div>
      <div><span class="status ${p.plan==="pin"?"st-pending":"st-live"}">${p.plan==="pin"?t("plan_pin_s"):t("plan_norm_s")} — ${fmt(p.fee||SHOP.fees[p.plan])}</span></div>
      <div class="small">TID: <b class="num" style="color:var(--ink)">${esc(p.tid)}</b> · ${ago(p.created)}</div>
      ${tidCount[(p.tid||"").trim()]>1?`<div class="warn">${t("dup_tid")}</div>`:""}
      <div class="two" style="margin-top:6px"><button class="btn" data-approve="${esc(uid)}|${esc(p.id)}">${t("approve")}</button><button class="btn red" data-reject="${esc(uid)}|${esc(p.id)}">${t("reject")}</button></div>
      <button class="small" style="color:var(--red);margin-top:4px" data-del="${esc(p.id)}">🗑️ ${t("del_spam")}</button>
    </div></div>`).join(""):`<div class="empty">${t("none_pending")}</div>`}`;
}

/* ===== events ===== */
function bind(){
  document.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>go(e.dataset.go));
  document.querySelectorAll("[data-open]").forEach(e=>e.onclick=()=>{if(live.find(a=>a.id===e.dataset.open))go("detail",e.dataset.open);else toast(t("t_notlive"))});
  document.querySelectorAll("[data-brand]").forEach(e=>e.onclick=()=>{brand=e.dataset.brand;render()});
  const so=$("#sort");if(so)so.onchange=()=>{sort=so.value;render()};
  document.querySelectorAll("[data-f]").forEach(e=>e.oninput=()=>{draft[e.dataset.f]=e.value});
  document.querySelectorAll("[data-plan]").forEach(e=>e.onclick=()=>{draft.plan=e.dataset.plan;render()});
  document.querySelectorAll("[data-rmph]").forEach(e=>e.onclick=()=>{draft.photos.splice(+e.dataset.rmph,1);render()});
  const ph=$("#phIn");if(ph)ph.onchange=async()=>{for(const f of [...ph.files].slice(0,5-draft.photos.length)){try{draft.photos.push(await compress(f))}catch(e){toast(t("t_badimg"))}}render()};
  const tp=$("#toPay");if(tp)tp.onclick=()=>{
    const d=draft;const miss=[];if(!d.brand)miss.push(t("m_brand"));if(!d.model.trim())miss.push(t("m_model"));if(!(+d.price>0))miss.push(t("m_price"));if(!d.seller.trim())miss.push(t("m_name"));if(waNum(d.phone).length<12)miss.push(t("m_phone"));
    if(miss.length)return toast(t("t_missing")+miss.join(t("sep")));
    if(!d.photos.length)toast(t("t_phototip"));
    go("pay");
  };
  const sp=$("#submitPay");if(sp)sp.onclick=async()=>{
    const tid=$("#tid").value.replace(/\s/g,"");
    if(tid.length<6)return toast(t("t_badtid"));
    sp.disabled=true;
    try{
      const photos=[...draft.photos]; const thumb=photos[0]?await makeThumb(photos[0]):"";
      const {photos:_,...rest}=draft;
      const post={...rest,id:uidGen(),price:+draft.price,fee:SHOP.fees[draft.plan],thumb,status:"pending",created:Date.now()};
      await API.submit(post,photos,tid);
      draft=newDraft();toast(t("t_submitted"));go("mine");
    }catch(e){console.log(e);sp.disabled=false;toast(t("t_savefail"))}
  };
  document.querySelectorAll("[data-approve]").forEach(e=>e.onclick=async()=>{
    const [,id]=e.dataset.approve.split("|");e.disabled=true;
    try{await API.update(id,{status:"live",approvedAt:Date.now()});toast(t("t_approved"));render()}catch(err){e.disabled=false;toast(t("t_approvefail"))}
  });
  document.querySelectorAll("[data-reject]").forEach(e=>e.onclick=()=>{
    const [uid,id]=e.dataset.reject.split("|");
    $("#modalRoot").innerHTML=`<div class="modal"><div class="box"><b>${t("reject_title")}</b><select id="rr" style="margin-top:8px">${REASONS.map(r=>`<option value="${r}">${t(r)}</option>`).join("")}</select><div class="two" style="margin-top:10px"><button class="btn red" id="rOk">${t("reject_ok")}</button><button class="btn ghost" id="rNo">${t("cancel")}</button></div></div></div>`;
    $("#rNo").onclick=()=>$("#modalRoot").innerHTML="";
    $("#rOk").onclick=async()=>{const note=$("#rr").value;$("#modalRoot").innerHTML="";try{await API.update(id,{status:"rejected",note});toast(t("t_rejected"));render()}catch(err){toast(t("t_changefail"))}};
  });
  document.querySelectorAll("[data-atab]").forEach(e=>e.onclick=()=>{adminTab=e.dataset.atab;setDraft=null;render()});
  document.querySelectorAll("[data-s]").forEach(e=>e.oninput=()=>{setDraft[e.dataset.s]=e.value});
  const qi=$("#qrIn");if(qi)qi.onchange=async()=>{const f=qi.files[0];if(!f)return;try{setDraft.qr=await compressQR(f);render()}catch(e){toast(t("t_badimg"))}};
  const cs=$("#cancelSet");if(cs)cs.onclick=()=>{setDraft=null;render()};
  const ss=$("#saveSet");if(ss)ss.onclick=async()=>{
    const d=setDraft;const till=String(d.tillId).replace(/\s/g,"");
    if(till.length<5)return toast(t("set_err_till"));
    if(waNum(d.whatsapp).length<12||waNum(d.phone).length<12)return toast(t("m_phone"));
    if(!(+d.normal>0)||!(+d.pin>0))return toast(t("set_err_fee"));
    const cfg={tillId:till,jcName:d.jcName.trim()||SHOP_DEFAULT.jcName,phone:String(d.phone).replace(/\D/g,""),whatsapp:waNum(d.whatsapp),fees:{normal:+d.normal,pin:+d.pin},updated:Date.now()};
    if(d.qr!==SHOP_DEFAULT.qr)cfg.qr=d.qr;
    ss.disabled=true;
    try{await API.saveConfig(cfg);applyConfig(cfg);setDraft=null;toast(t("set_saved"));render()}
    catch(e){ss.disabled=false;toast(t("t_savefail"))}
  };
  const bi=$("#bnIn");if(bi)bi.onchange=async()=>{const f=bi.files[0];if(!f)return;bnDraft.link=($("#bnLink")||{}).value||"";try{bnDraft.img=await compressBanner(f);render()}catch(e){toast(t("t_badimg"))}};
  const bl=$("#bnLink");if(bl)bl.oninput=()=>{bnDraft.link=bl.value};
  const bs=$("#bnSave");if(bs)bs.onclick=async()=>{
    let link=bnDraft.link.trim();if(link&&!/^https?:\/\//i.test(link))link="https://"+link;
    const maxO=banners.reduce((m,b)=>Math.max(m,b.order||0),0);
    bs.disabled=true;
    try{await API.saveBanner({id:uidGen(),img:bnDraft.img,link,order:maxO+1,created:Date.now()});bnDraft={img:"",link:""};toast(t("bn_saved"));render()}catch(e){bs.disabled=false;toast(t("t_savefail"))}
  };
  document.querySelectorAll("[data-bdel]").forEach(e=>e.onclick=()=>confirmBox(t("bn_delq"),t("del_btn"),async()=>{try{await API.delBanner(e.dataset.bdel);toast(t("t_deleted"));render()}catch(err){toast(t("t_removefail"))}}));
  document.querySelectorAll("[data-bmove]").forEach(e=>e.onclick=async()=>{
    const [id,dir]=e.dataset.bmove.split("|");const L=[...banners].sort((a,b)=>(a.order||0)-(b.order||0));const i=L.findIndex(b=>b.id===id),j=i+(+dir);if(j<0||j>=L.length)return;
    const A={...L[i],order:L[j].order||j},B={...L[j],order:L[i].order||i};if(A.order===B.order)A.order+=+dir;
    try{await API.saveBanner(A);await API.saveBanner(B);render()}catch(err){toast(t("t_changefail"))}
  });
  document.querySelectorAll("[data-sold]").forEach(e=>e.onclick=()=>{
    const id=e.dataset.sold;
    confirmBox(t("sold_confirm"),t("yes"),async()=>{try{await API.sold(id);dropLocal(id);toast(t("t_sold"));if(view==="detail")go("home");else render()}catch(err){toast(t("t_removefail"))}},"");
  });
  document.querySelectorAll("[data-del]").forEach(e=>e.onclick=()=>{
    const id=e.dataset.del;
    confirmBox(t("del_confirm"),t("del_btn"),async()=>{try{await API.del(id);dropLocal(id);toast(t("t_deleted"));if(view==="detail")go("home");else render()}catch(err){toast(t("t_removefail"))}});
  });
  const mb=$("#moreBtn");if(mb)mb.onclick=()=>{mb.disabled=true;pageLimit+=PAGE;if(window.subLive)subLive()};
  const ib=$("#installBtn");if(ib)ib.onclick=async()=>{ if(installEvt){installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;render()} else toast(t("install_ios")) };
  const al=$("#adminLogin");if(al)al.onclick=adminLogin;
  const ao=$("#adminLogout");if(ao)ao.onclick=adminLogout;
}
